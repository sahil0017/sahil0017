<svg width="1200" height="240" viewBox="0 0 1200 240" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0B1120"/>
      <stop offset="55%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0.82" cy="0.28" r="0.45">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.15" cy="0.85" r="0.4">
      <stop offset="0%" stop-color="#818CF8" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#818CF8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1E293B" stroke-width="0.75" opacity="0.55"/>
    </pattern>
  </defs>

  <rect width="1200" height="240" rx="14" fill="url(#bg)"/>
  <rect width="1200" height="240" rx="14" fill="url(#grid)"/>
  <rect width="1200" height="240" rx="14" fill="url(#glow1)"/>
  <rect width="1200" height="240" rx="14" fill="url(#glow2)"/>
  <rect x="0.75" y="0.75" width="1198.5" height="238.5" rx="13.25" stroke="#1E293B" stroke-width="1.5"/>

  <!-- Top accent bar -->
  <rect x="56" y="42" width="64" height="4" rx="2" fill="url(#accent)"/>

  <!-- Name & Subtitle -->
  <text x="56" y="102" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="700" letter-spacing="-0.8">Sahil Kanungo</text>
  <text x="56" y="140" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="500">Systems &amp; Agentic AI Engineer</text>
  <text x="56" y="176" fill="#64748B" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="13.5">Go · Python · TypeScript · Distributed Control Planes · Multi-Agent Runtimes · AWS</text>

  <!-- Minimal distributed graph motif on the right -->
  <g stroke="#334155" stroke-width="1.5" opacity="0.9">
    <line x1="870" y1="74" x2="965" y2="118"/>
    <line x1="870" y1="168" x2="965" y2="118"/>
    <line x1="965" y1="118" x2="1065" y2="78"/>
    <line x1="965" y1="118" x2="1065" y2="162"/>
    <line x1="1065" y1="78" x2="1130" y2="118"/>
    <line x1="1065" y1="162" x2="1130" y2="118"/>
  </g>
  <g>
    <circle cx="870" cy="74" r="6" fill="#0F172A" stroke="#38BDF8" stroke-width="2"/>
    <circle cx="870" cy="168" r="6" fill="#0F172A" stroke="#818CF8" stroke-width="2"/>
    <circle cx="965" cy="118" r="9" fill="#0F172A" stroke="#38BDF8" stroke-width="2.5"/>
    <circle cx="965" cy="118" r="3" fill="#38BDF8"/>
    <circle cx="1065" cy="78" r="6" fill="#0F172A" stroke="#34D399" stroke-width="2"/>
    <circle cx="1065" cy="162" r="6" fill="#0F172A" stroke="#818CF8" stroke-width="2"/>
    <circle cx="1130" cy="118" r="7" fill="#0F172A" stroke="#34D399" stroke-width="2"/>
